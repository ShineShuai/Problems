name: Code Quality Checks

on: [push, pull_request]

jobs:
  clang-format:
    name: Run clang-format
    runs-on: ubuntu-latest
    # container:
    #   image: debian:bookworm-slim  # Runs inside Debian container
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        # This checks out your code AND .clang-format to the workspace

      - name: Run clang-format lint
        uses: DoozyX/clang-format-lint-action@v0.20
        with:
          source: 'Algorithms'
          clangFormatVersion: 20
          # It automatically finds .clang-format in the repo root

      - name: Configure CMake
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: run-clang-tidy -j$(nproc) -p build -config-file=.clang-tidy -use-color -warnings-as-errors='*'